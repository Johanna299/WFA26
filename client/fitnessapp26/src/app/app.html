<!-- Main application header -->
<header class="app-header">
  <div class="header-inner">
    <!-- Logo area -->
    <a class="brand" routerLink="/home">
      FitFlow
    </a>

    <!-- Main navigation -->
    <nav class="main-nav">
      <!-- Home -->
      <!--add class 'active-link' if this route matches the current URL -->
      <a
        routerLink="/home"
        routerLinkActive="active-link">
        Home
      </a>

      <!-- Public course overview -->
      <a
        routerLink="/courses"
        routerLinkActive="active-link">
        Kurse
      </a>

      <!-- Show participant dashboard only for logged-in participants -->
      @if (isParticipant()) {
        <a
          routerLink="/bookings"
          routerLinkActive="active-link">
          Meine Buchungen
        </a>
      }

      <!-- Show trainer dashboard only for logged-in trainers -->
      @if (isLoggedIn() && isTrainer()) {
        <a
          routerLink="/trainer/courses"
          routerLinkActive="active-link">
          Meine Kurse
        </a>
      }
    </nav>

    <!-- Authentication actions -->
    <div class="header-actions">
      <!-- Show login icon if no user is logged in -->
      @if (!isLoggedIn()) {
        <!-- Navigate to the login page -->
        <button
          mat-icon-button
          routerLink="/login"
          aria-label="Login">
          <mat-icon>account_circle</mat-icon>
        </button>
      }

      <!-- Show logout icon if a user is logged in -->
      @if (isLoggedIn()) {
        <!--Logout when the user clicks this button-->
        <button
          mat-icon-button
          (click)="logout()"
          aria-label="Logout">
          <mat-icon>logout</mat-icon>
        </button>
      }
    </div>
  </div>
</header>

<!-- Main routed content -->
<main class="page-shell">
  <div class="page-content">
    <router-outlet></router-outlet>
  </div>
</main>
